name: Newifi3 ImmortalWrt 23.05.7 (ImageBuilder)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Actions
      uses: actions/checkout@v4

    - name: Install ImageBuilder Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

    - name: Download Official ImageBuilder
      run: |
        # 直接拉取 23.05.7 官方稳定版的打包器，彻底告别源码编译报错
        wget https://downloads.immortalwrt.org/releases/23.05.7/targets/ramips/mt7621/immortalwrt-imagebuilder-23.05.7-ramips-mt7621.Linux-x86_64.tar.xz
        tar -xvf immortalwrt-imagebuilder-23.05.7-ramips-mt7621.Linux-x86_64.tar.xz
        mv immortalwrt-imagebuilder-23.05.7-ramips-mt7621.Linux-x86_64 imagebuilder

    - name: Create Custom Initialization Script (Guaranteed IP)
      run: |
        cd imagebuilder
        mkdir -p files/etc/uci-defaults
        # 写入开机自启脚本，强制把 LAN 口 IP 钉死在 192.168.1.1
        cat << 'EOF' > files/etc/uci-defaults/99-init-settings
        uci set network.lan.ipaddr='192.168.1.1'
        uci commit network
        EOF
        chmod +x files/etc/uci-defaults/99-init-settings

    - name: Build Firmware
      run: |
        cd imagebuilder
        
        # 使用 ImageBuilder 独有的语法：直接列出需要的包，用减号 (-) 剔除冲突包
        make image PROFILE="d-team_newifi-d2" \
        PACKAGES="luci luci-ssl-openssl luci-theme-argon \
        dnsmasq-full wpad-openssl libustream-openssl \
        kmod-wireguard wireguard-tools luci-app-wireguard luci-proto-wireguard \
        luci-app-openvpn luci-app-openvpn-server luci-app-aliddns luci-app-opkg \
        luci-app-ttyd luci-app-vlmcsd luci-app-wol luci-app-arpbind luci-app-watchcat \
        luci-app-adguardhome \
        parted blkid e2fsprogs kmod-usb-core kmod-usb3 kmod-usb-storage kmod-usb-storage-extras \
        kmod-fs-ext4 kmod-fs-vfat kmod-nls-utf8 block-mount \
        -dnsmasq -libustream-mbedtls -wpad-basic-mbedtls" \
        FILES="files"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v23.05.7_ImageBuilder"
        name: "Newifi3 D2 终极云打包版 (绝不失联)"
        body: "使用官方 ImageBuilder 积木打包方案。已彻底杜绝底层编译冲突导致的网络瘫痪。内置固化 IP 脚本、WireGuard 全家桶、Watchcat 及完整 U盘挂载环境。"
        files: imagebuilder/bin/targets/ramips/mt7621/*sysupgrade.bin
