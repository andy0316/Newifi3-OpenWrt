name: Build Newifi3 ImmortalWrt 23.05.7 Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Actions
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code and Lock Version
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        # 强行检出并锁定到 v23.05.7 稳定版标签
        git checkout v23.05.7

    - name: Clone 3rd-party Plugins (Diskman)
      run: |
        cd openwrt
        mkdir -p package/custom
        git clone https://github.com/lisaac/luci-app-diskman.git package/custom/luci-app-diskman

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Custom Configuration
      run: |
        cd openwrt
        rm -f .config
        touch .config
        
        cat >> .config <<EOF
        # 1. 硬件锁定 (MT7621 Newifi D2)
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y
        
        # 2. 【核心修复】解决基础包冲突 (dnsmasq vs dnsmasq-full, wpad-basic vs wpad-openssl)
        # CONFIG_PACKAGE_dnsmasq is not set
        CONFIG_PACKAGE_dnsmasq_full=y
        # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
        # CONFIG_PACKAGE_wpad-basic-wolfssl is not set
        CONFIG_PACKAGE_wpad-openssl=y
        
        # 3. 强制保底网页后台，防止出现 Headless
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_IPADDR="192.168.1.1"
        
        # 4. 核心网络与 VPN
        CONFIG_PACKAGE_luci-app-wireguard=y
        CONFIG_PACKAGE_luci-app-openvpn=y
        CONFIG_PACKAGE_luci-app-openvpn-server=y
        CONFIG_PACKAGE_luci-app-aliddns=y
        CONFIG_PACKAGE_luci-app-opkg=y
        
        # 5. 辅助工具
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-app-vlmcsd=y
        CONFIG_PACKAGE_luci-app-wol=y
        CONFIG_PACKAGE_luci-app-arpbind=y
        
        # 6. AdGuardHome 控制台
        CONFIG_PACKAGE_luci-app-adguardhome=y
        
        # 7. Diskman 及磁盘依赖
        CONFIG_PACKAGE_luci-app-diskman=y
        CONFIG_PACKAGE_parted=y
        CONFIG_PACKAGE_blkid=y
        CONFIG_PACKAGE_e2fsprogs=y
        
        # 8. U盘底层挂载支持
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-extras=y
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-nls-utf8=y
        CONFIG_PACKAGE_block-mount=y
        
        # 9. 减负排雷：干掉耗费空间的重型插件
        CONFIG_PACKAGE_luci-app-adbyby-plus=n
        CONFIG_PACKAGE_luci-app-unblockmusic=n
        CONFIG_PACKAGE_luci-app-zerotier=n
        CONFIG_PACKAGE_luci-app-ssr-plus=n
        CONFIG_PACKAGE_luci-app-passwall=n
        CONFIG_PACKAGE_luci-app-vssr=n
        EOF
        
        make defconfig

    - name: Download Packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize Files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        tag_name: "v23.05.7_Newifi3_${{ env.FILE_DATE }}"
        name: "Newifi3 D2 纯正稳定版 (v23.05.7)"
        body: "已强制锁定 ImmortalWrt v23.05.7 稳定内核。修复了 dnsmasq 依赖冲突问题。内置 WireGuard、Diskman、AGH 界面及完善的 U 盘驱动。"
        files: ${{ env.FIRMWARE }}/*sysupgrade.bin
