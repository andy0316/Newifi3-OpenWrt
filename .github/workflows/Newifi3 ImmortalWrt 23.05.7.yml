name: Build Newifi3 ImmortalWrt 23.05.7 Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig libffi-dev libpython3-dev

    - name: Clone and Lock Version
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git checkout v23.05.7 # 强制锁定稳定版标签，彻底杜绝 SNAPSHOT

    - name: Clone Plugins
      run: |
        cd openwrt
        mkdir -p package/custom
        git clone https://github.com/lisaac/luci-app-diskman.git package/custom/luci-app-diskman

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Configuration
      run: |
        cd openwrt
        rm -f .config
        touch .config
        cat >> .config <<EOF
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y
        
        # 强制 IP，防止进不去后台
        CONFIG_IPADDR="192.168.1.1"
        
        # 核心插件
        CONFIG_PACKAGE_luci-app-wireguard=y
        CONFIG_PACKAGE_luci-app-openvpn=y
        CONFIG_PACKAGE_luci-app-openvpn-server=y
        CONFIG_PACKAGE_luci-app-aliddns=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        CONFIG_PACKAGE_luci-app-vlmcsd=y
        CONFIG_PACKAGE_luci-app-wol=y
        CONFIG_PACKAGE_luci-app-arpbind=y
        CONFIG_PACKAGE_luci-app-adguardhome=y
        CONFIG_PACKAGE_luci-app-diskman=y
        
        # 系统与挂载依赖
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-nls-utf8=y
        CONFIG_PACKAGE_parted=y
        CONFIG_PACKAGE_blkid=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        EOF
        make defconfig

    - name: Compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: "v23.05.7_Newifi3"
        files: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin